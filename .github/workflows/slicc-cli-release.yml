# Attach the cross-compiled `slicc` CLI binaries to each GitHub release. The two
# macOS binaries are Developer ID-signed + notarized so they pass Gatekeeper.
#
# Decoupled from the main semantic-release flow (release.yml / .releaserc.json)
# on purpose: it runs AFTER semantic-release has created the release (which
# creates the tag), so a Go build / signing hiccup can never break the npm /
# native release — it just means the binaries aren't attached, and this job can
# be re-run (`--clobber` makes it idempotent) or triggered manually for a tag.
#
# It runs on macOS (not ubuntu) so it can reuse the same Developer ID Application
# certificate and App Store Connect notarytool credentials release.yml uses for
# Sliccstart / swift-server. Cross-compiling every target from macOS is fine
# (pure-Go, CGO_ENABLED=0); only the two darwin binaries are signed + notarized.
name: slicc-cli release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build + attach binaries to
        required: true

permissions:
  contents: write

concurrency:
  group: slicc-cli-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  binaries:
    # macos-26 matches release.yml so the Developer ID cert import (openssl
    # legacy-provider round-trip) and notarytool behave identically.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/slicc-cli/go.mod
          cache-dependency-path: packages/slicc-cli/go.sum

      # Import the Developer ID Application cert into a throwaway keychain.
      # Mirrors the import in release.yml (keep in sync), trimmed to the single
      # cert the CLI needs. The openssl round-trip normalizes the legacy-RC2
      # .p12 that newer macos-arm64 `security import` rejects. When the secret is
      # absent (e.g. a fork), the step no-ops and the binaries ship unsigned.
      - name: Import Developer ID Application certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/slicc-cli-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          tmpdir="$(mktemp -d "$RUNNER_TEMP/p12.XXXXXX")"
          chmod 700 "$tmpdir"
          trap 'rm -rf "$tmpdir"' EXIT
          raw="$tmpdir/raw.p12"
          pem="$tmpdir/cert.pem"
          norm="$tmpdir/normalized.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$raw"

          # macos-26 ships OpenSSL 3.x: try the modern read/write first, fall
          # back to the -legacy provider for the RC2-40 legacy .p12.
          if ! openssl pkcs12 -in "$raw" -nodes -out "$pem" -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" 2>/dev/null; then
            openssl pkcs12 -in "$raw" -nodes -out "$pem" -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" -legacy
          fi
          if ! openssl pkcs12 -export -in "$pem" -out "$norm" -password "pass:${APPLE_CERTIFICATE_PASSWORD}" \
               -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha256 2>/dev/null; then
            openssl pkcs12 -export -in "$pem" -out "$norm" -password "pass:${APPLE_CERTIFICATE_PASSWORD}" \
              -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha256 -legacy
          fi
          security import "$norm" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found after import"
            exit 1
          fi
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Cross-compile all targets
        working-directory: packages/slicc-cli
        run: make dist VERSION=${{ github.event.release.tag_name || inputs.tag }}

      # Developer ID-sign (hardened runtime + secure timestamp) and notarize the
      # two darwin binaries. A bare CLI binary can't be stapled (only .app/.dmg/
      # .pkg), so Gatekeeper verifies the notarization online on first run — the
      # cdhash registered by notarization belongs to the signed binary we upload.
      - name: Sign + notarize macOS binaries
        if: env.KEYCHAIN_PATH != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        working-directory: packages/slicc-cli/dist
        run: |
          set -euo pipefail
          for bin in slicc-darwin-arm64 slicc-darwin-amd64; do
            echo "Signing $bin"
            codesign --force --timestamp --options runtime \
              --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "::warning::notarytool credentials absent — binaries are signed but not notarized"
            exit 0
          fi
          key_p8="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_p8"
          trap 'rm -f "$key_p8"' EXIT
          # One submission notarizes every Mach-O in the zip (both cdhashes).
          zip -q notarize.zip slicc-darwin-arm64 slicc-darwin-amd64
          echo "Submitting darwin binaries to notarytool..."
          xcrun notarytool submit notarize.zip \
            --key "$key_p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --wait
          rm -f notarize.zip

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" packages/slicc-cli/dist/slicc-* --clobber

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  swift-launcher:
    needs: [changes, lint]
    # The launcher no longer bundles the webapp (`dist/ui`) — the UI loads from
    # the hosted origin — so webapp/vfs-root changes no longer trigger this slow
    # macos-latest job. The ONE web artifact it still embeds is the overlay
    # bootstrap, which now lives in the small `@ai-ecoverse/spoon` package, so a
    # `packages/spoon/**` change DOES trigger this job (and only that, not a
    # general webapp UI change). Assets still matter: `assemble-app.mjs` reads the
    # macOS icon from `packages/assets/`, so an asset-only PR must still build
    # Sliccstart.app. A pure webapp/vfs-root PR now skips swift-launcher entirely
    # (skipped = passing in the `ci` summary gate). The root-config trigger is
    # the narrower `native-root-config`: a tsconfig/vitest/lockfile-only PR
    # (mostly renovate bumps) cannot change a Swift compile, and the npm side of
    # this job is validated by the fast ubuntu jobs first.
    if: >-
      needs.lint.result == 'success' &&
      needs.changes.outputs.is-queue-leader == 'true' &&
      (needs.changes.outputs.swift-launcher == 'true' ||
      needs.changes.outputs.swift-server == 'true' ||
      needs.changes.outputs.swift-optel == 'true' ||
      needs.changes.outputs.swift-traysession == 'true' ||
      needs.changes.outputs.swift-config == 'true' ||
      needs.changes.outputs.spoon == 'true' ||
      needs.changes.outputs.assets == 'true' ||
      needs.changes.outputs.native-root-config == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - name: Install SwiftLint
        run: brew install swiftlint
      # Artifacts from a mismatched toolchain are the classic way an SPM cache
      # turns a green build red, and `macos-latest` rolls its Xcode without
      # notice — so the toolchain identity is part of the cache key, not a hope.
      - name: Record Swift toolchain fingerprint
        id: swift-toolchain
        run: echo "id=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # This job builds swift-server from scratch on every run — ~6 of its ~10
      # minutes — even when swift-server itself is unchanged and its own job is
      # skipped. Keying `.build` on the Swift sources plus the toolchain makes
      # the common case incremental. `coverage/` is excluded so a restored cache
      # can never hand a stale profile to the upload steps below.
      - name: Cache Swift build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/swift-launcher/.build
            !packages/swift-launcher/.build/coverage
            packages/swift-server/.build
          key: swift-launcher-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.id }}-${{ hashFiles('packages/swift-launcher/Package.*', 'packages/swift-server/Package.*', 'packages/swift-optel/Package.*', 'packages/swift-traysession/Package.*') }}-${{ hashFiles('packages/swift-launcher/Sliccstart/**', 'packages/swift-launcher/SliccstartTests/**', 'packages/swift-server/Sources/**', 'packages/swift-server/Tests/**', 'packages/swift-optel/Sources/**', 'packages/swift-traysession/Sources/**') }}
          restore-keys: |
            swift-launcher-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.id }}-${{ hashFiles('packages/swift-launcher/Package.*', 'packages/swift-server/Package.*', 'packages/swift-optel/Package.*', 'packages/swift-traysession/Package.*') }}-
      - name: Lint (SwiftLint)
        run: cd packages/swift-launcher && swiftlint lint --reporter github-actions-logging
      # swift-format ships with the toolchain; config is the root .swift-format.
      - name: Lint (swift-format)
        run: cd packages/swift-launcher && swift format lint --strict --parallel --recursive Sliccstart SliccstartTests Package.swift
      - name: Build swift-server (dependency)
        run: cd packages/swift-server && swift build -c release
      - name: Test (with coverage threshold gate)
        env:
          # UpdateCheckIntegrationTests hits the real GitHub API.
          # Authenticate to lift the 60/hr unauth limit (which is shared per
          # runner IP and routinely exhausted on `macos-latest`) up to the
          # 5,000/hr authenticated limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packages/dev-tools/tools/swift-coverage-check.sh \
            packages/swift-launcher SliccstartPackageTests
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-swift-launcher
          path: packages/swift-launcher/.build/coverage/
          if-no-files-found: ignore
      # UpdateCheckIntegrationTests hits the real GitHub API, so this suite is the
      # repo's most plausible native flake source; the xUnit report records which
      # test was slow or failed on any given run.
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-swift-launcher
          path: packages/swift-launcher/.build/coverage/test-timings*
          if-no-files-found: ignore
      - name: Build overlay bootstrap (dist/ui/electron-overlay-entry.js)
        # `assemble-app.mjs` copies ONLY `dist/ui/electron-overlay-entry.js`
        # into the bundle so packaged `slicc-server --electron` loads the real
        # overlay instead of the inline fallback. The launcher no longer bundles
        # the rest of `dist/ui` (the UI loads from the hosted origin); the overlay
        # bootstrap is produced by the small `@ai-ecoverse/spoon` package (a fast,
        # webapp-free esbuild) and must exist before assembly or
        # `copyElectronOverlayEntry` fails fast.
        run: npm run build -w @ai-ecoverse/spoon
      - name: Build
        run: npm run build -w @slicc/swift-launcher
      - name: Upload Sliccstart.app artifact (unsigned, for PR verification)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sliccstart-${{ github.event.pull_request.number || github.run_id }}-unsigned
          path: packages/swift-launcher/build/Sliccstart.app
          if-no-files-found: error
      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery
      - name: Dead code detection (Periphery)
        run: |
          # Informational scan; surfaces unused Swift declarations without
          # blocking PRs while existing findings get cleaned up incrementally.
          cd packages/swift-launcher && periphery scan --disable-update-check || true

  ios-app:
    needs: [changes, lint]
    if: >-
      needs.lint.result == 'success' &&
      needs.changes.outputs.is-queue-leader == 'true' &&
      (needs.changes.outputs.ios-app == 'true' ||
      needs.changes.outputs.swift-traysession == 'true' ||
      needs.changes.outputs.swift-trayfollower == 'true' ||
      needs.changes.outputs.swift-config == 'true')
    # The iOS 26 deployment target requires the Xcode 26 SDK.
    runs-on: macos-26
    # Simulator boots can wedge on fresh runner images; fail fast instead of
    # holding the merge queue for the 6h default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # swift-coverage-check.sh reads its floors from coverage-thresholds.json
      # via node, so pin Node (matches the other Swift jobs) instead of relying
      # on the runner's preinstalled version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint (SwiftLint)
        run: cd packages/ios-app && swiftlint lint --reporter github-actions-logging
      # swift-format ships with the toolchain; config is the root .swift-format.
      - name: Lint (swift-format)
        run: cd packages/ios-app && swift format lint --strict --parallel --recursive SliccFollower Package.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd packages/ios-app && xcodegen generate
      - name: Resolve SPM dependencies
        run: |
          cd packages/ios-app
          xcodebuild -resolvePackageDependencies \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          cd packages/ios-app
          xcodebuild build \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build (iOS device)
        run: |
          set -o pipefail
          cd packages/ios-app
          xcodebuild build \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery
      - name: Dead code detection (Periphery)
        run: |
          # Informational scan; surfaces unused Swift declarations without
          # blocking PRs while existing findings get cleaned up incrementally.
          # Unlike the SPM packages, an xcodegen project has no Package.swift for
          # Periphery to infer from, so the project/scheme/target are explicit.
          cd packages/ios-app && periphery scan \
            --project SliccFollower.xcodeproj \
            --schemes SliccFollower \
            --targets SliccFollower \
            --disable-update-check || true

  # Simulator test matrix: device × iOS runtime, all cells concurrent so the
  # slowest leg (not the sum of legs) bounds iOS wall-clock. The iPhone/26
  # cell is the canonical coverage-gated run; iPhone/27 repeats the unit suite
  # against the beta SDK without the coverage gate (line coverage shifts
  # between SDKs, and the floors track the stable one). iPad cells run the
  # regular-width browser regression. iOS 27 cells ride the `xcode-27` beta
  # runner image and are informational (continue-on-error) until 27 goes GA —
  # a beta-image breakage must not hold the merge queue.
  ios-app-tests:
    needs: [changes, lint]
    if: >-
      needs.lint.result == 'success' &&
      needs.changes.outputs.is-queue-leader == 'true' &&
      (needs.changes.outputs.ios-app == 'true' ||
      needs.changes.outputs.swift-traysession == 'true' ||
      needs.changes.outputs.swift-trayfollower == 'true' ||
      needs.changes.outputs.swift-config == 'true')
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        ios: ['26', '27']
    runs-on: ${{ matrix.ios == '27' && 'xcode-27' || 'macos-latest' }}
    continue-on-error: ${{ matrix.ios == '27' }}
    # Simulator boots can wedge on fresh runner images; fail fast instead of
    # holding the merge queue for the 6h default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # swift-coverage-check.sh reads its floors from coverage-thresholds.json
      # via node, so pin Node (matches the other Swift jobs) instead of relying
      # on the runner's preinstalled version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd packages/ios-app && xcodegen generate
      - name: Resolve SPM dependencies
        run: |
          cd packages/ios-app
          xcodebuild -resolvePackageDependencies \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower
      # Golden-fixture protocol corpus + unit tests. The shared coverage script
      # picks the simulator, runs `xcodebuild test` with coverage + parallel
      # testing + on-failure retries, and gates the result against the `ios-app`
      # floors in coverage-thresholds.json.
      - name: Test (iPhone unit suite, coverage threshold gate)
        if: matrix.device == 'iPhone' && matrix.ios == '26'
        run: |
          ./packages/dev-tools/tools/swift-coverage-check.sh \
            --xcodebuild SliccFollower packages/ios-app SliccFollower
      # Both non-coverage legs share ios-sim-test.sh, which reuses the
      # coverage script's simulator selection, SLICC_IOS_SIM_UDID override,
      # pre-boot, and runner-init retry — one canonical path, no drift.
      - name: Test (iPhone unit suite, no coverage gate)
        if: matrix.device == 'iPhone' && matrix.ios != '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPhone \
            --result-bundle .build/unit-suite.xcresult \
            --only-testing SliccFollowerTests
      # The composer must stay typable through connection trouble, and the
      # keyboard must follow focus and nothing else. Compact width is where
      # that regressed, so this runs on the iPhone leg rather than the iPad
      # ones. Its own class, not all of ComposerKeyboardUITests: those drive
      # `typeKey` and need a hardware keyboard the runner has not got.
      - name: Test composer under connection trouble (iPhone)
        if: matrix.device == 'iPhone' && matrix.ios == '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPhone \
            --result-bundle .build/composer-connection-ui.xcresult \
            --only-testing SliccFollowerUITests/ComposerConnectionUITests
      - name: Test regular-width browser (iPad)
        if: matrix.device == 'iPad'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPad \
            --result-bundle .build/regular-width-ui.xcresult \
            --only-testing SliccFollowerUITests/RemoteTabUITests/testRegularWidthBrowsingEntersAndExitsFullScreen
      # The readable-column cap only pays off if the column is also centered,
      # and both halves are invisible on the iPhone leg — compact width never
      # reaches the cap. iPad is the only destination that can see a regression.
      - name: Test regular-width transcript column (iPad)
        if: matrix.device == 'iPad'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPad \
            --result-bundle .build/transcript-column-ui.xcresult \
            --only-testing SliccFollowerUITests/TranscriptColumnUITests
      - name: Upload coverage report
        if: always() && matrix.device == 'iPhone' && matrix.ios == '26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ios-app
          path: packages/ios-app/.build/coverage/lcov.info
          if-no-files-found: ignore
      # Per-test timings live in the result bundle; upload it so a slow or flaky
      # test can be diagnosed without re-running the simulator locally.
      - name: Upload test timings (xcresult)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-ios-app-${{ matrix.ios }}-${{ matrix.device }}
          path: |
            packages/ios-app/.build/coverage/ios-app.xcresult
            packages/ios-app/.build/unit-suite.xcresult
            packages/ios-app/.build/regular-width-ui.xcresult
          if-no-files-found: ignore

  global-install:
    needs: changes
    if: >-
      needs.changes.outputs.cloud-core == 'true' ||
      needs.changes.outputs.node-server == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - name: Build @slicc/shared-ts
        run: npm run build -w @slicc/shared-ts
      - name: Build node-server
        run: npm run build -w @slicc/node-server
      - name: Pack
        run: echo "tarball=$(npm pack --quiet | tail -1)" >> "$GITHUB_OUTPUT"
        id: pack
      # `npm install -g <tarball>` and `npx sliccy@file:…` resolve the packed
      # tarball's dependencies FRESH from the registry — the repo lockfile does
      # not apply to either — so this is the one job whose result depends on
      # registry state at the moment it runs. That is deliberate (it is what a
      # real `npm i -g sliccy` does), but it means transient registry flux fails
      # a job that has nothing to do with the diff under test.
      #
      # Seen 2026-08-20: a newly published `@peculiar/*` release pinned
      # `@peculiar/asn1-schema@^2.9.4` before that version had replicated to the
      # runner's registry mirror, and the install died with
      # `ETARGET No matching version found`. The same commit passed this job 15
      # minutes earlier and again 15 minutes later. npm's own fetch-retries do
      # not cover it — the packument fetch SUCCEEDS, it just does not list the
      # version yet — so nothing retried and a green PR (#2216) was dequeued from
      # the merge queue, where a run gets no second chance.
      #
      # `prefer-online` carries as much weight as the loop: without it a retry
      # can re-read the same stale packument from the runner's metadata cache and
      # fail identically. A dependency that genuinely does not resolve still
      # fails, just after ~45s of trying.
      - name: Test global install
        env:
          npm_config_prefer_online: 'true'
        run: |
          set -o pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::npm install -g (attempt $i/$attempts)"
            status=0
            npm install -g "./${{ steps.pack.outputs.tarball }}" || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$i" -ge "$attempts" ]; then
              echo "global install failed (exit $status) after $attempts attempts" >&2
              exit "$status"
            fi
            delay=$((i * 15))
            echo "global install failed (exit $status) on attempt $i/$attempts; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          slicc --version
      - name: Test npx
        env:
          npm_config_prefer_online: 'true'
        run: |
          set -o pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::npx (attempt $i/$attempts)"
            status=0
            npx --yes "sliccy@file:./${{ steps.pack.outputs.tarball }}" --version || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$i" -ge "$attempts" ]; then
              echo "npx failed (exit $status) after $attempts attempts" >&2
              exit "$status"
            fi
            delay=$((i * 15))
            echo "npx failed (exit $status) on attempt $i/$attempts; retrying in ${delay}s" >&2
            sleep "$delay"
          done

  # Wait for any in-progress release before allowing merge queue to land.
  # Only runs on merge_group events; skipped (= passing) for PRs.
  release-gate:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Wait for active release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            ACTIVE=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=in_progress&per_page=1" --jq '.total_count')
            QUEUED=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=queued&per_page=1" --jq '.total_count')
            if [ "$ACTIVE" = "0" ] && [ "$QUEUED" = "0" ]; then
              echo "No release in progress, proceeding"
              break
            fi
            echo "Release running (active=$ACTIVE queued=$QUEUED), waiting 30s..."
            sleep 30
          done

  # Bundle-size budgets for the two Vite-bundled browser apps. Before this
  # job the only shipped-size gate in the repo was the worker's
  # `wrangler deploy --dry-run` (Cloudflare's 25 MiB per-file asset cap), so
  # webapp and extension growth was invisible until someone noticed a slow
  # cold load. Budgets live next to the code they guard, in each package's
  # `size-limit` block, and are measured on raw (non-brotli) bytes to match
  # the asset-cap framing of the worker gate. They are ratchets: tighten them
  # as payloads shrink; raising one needs a reason in the PR body.
  #
  # `dev-tools` is in the filter list because the webapp inlines
  # `packages/dev-tools/providers.build.json` at build time to decide which
  # providers get bundled, so editing it alone moves the shipped size.
  bundle-size:
    needs: changes
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.vfs-root == 'true' ||
      needs.changes.outputs.assets == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.spoon == 'true' ||
      needs.changes.outputs.webcomponents == 'true' ||
      needs.changes.outputs.cherry == 'true' ||
      needs.changes.outputs.dev-tools == 'true' ||
      needs.changes.outputs.root-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - name: Build webapp
        run: npm run build -w @slicc/webapp
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
      - name: Build extension
        run: npm run build -w @slicc/chrome-extension
      - name: Check bundle-size budgets
        run: npm run bundle-size

  # Summary job — the single required status check for branch protection
  ci:
    if: always()
    needs:
      [
        changes,
        lint,
        linear-history,
        typecheck,
        node-matrix-tests,
        webapp,
        e2e,
        node-server,
        chrome-extension,
        cloudflare-worker,
        cloud-core,
        shared,
        webcomponents,
        spoon,
        bundle-size,
        global-install,
        swift-launcher,
        swift-server,
        swift-optel,
        swift-traysession,
        swift-trayfollower,
        ios-app,
        ios-app-tests,
        go-optel,
        slicc-cli,
        release-gate,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs failed or were cancelled"
            exit 1
          fi

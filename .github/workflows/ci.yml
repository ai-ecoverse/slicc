  ios-app:
    needs: [changes, lint]
    if: >-
      needs.lint.result == 'success' &&
      needs.changes.outputs.is-queue-leader == 'true' &&
      (needs.changes.outputs.ios-app == 'true' ||
      needs.changes.outputs.swift-traysession == 'true' ||
      needs.changes.outputs.swift-trayfollower == 'true' ||
      needs.changes.outputs.swift-traykit == 'true' ||
      needs.changes.outputs.swift-widgetkit == 'true' ||
      needs.changes.outputs.swift-config == 'true')

    runs-on: macos-26

    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint (SwiftLint)
        run: cd packages/ios-app && swiftlint lint --reporter github-actions-logging

      - name: Lint (swift-format)
        run: |
          cd packages/ios-app && swift format lint --strict --parallel --recursive \
            SliccFollower SliccTrayKit SliccFileProvider SliccShareExtension SliccWidgets Package.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd packages/ios-app && xcodegen generate
      - name: Resolve SPM dependencies
        run: |
          cd packages/ios-app
          xcodebuild -resolvePackageDependencies \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower

      - name: Check SwiftPM lockfile drift
        run: |
          node packages/dev-tools/tools/check-swift-resolved-drift.mjs \
            packages/ios-app/SliccFollower.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            packages/ios-app/Package.resolved
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          cd packages/ios-app
          xcodebuild build \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build (iOS device)
        run: |
          set -o pipefail
          cd packages/ios-app
          xcodebuild build \
            -project SliccFollower.xcodeproj \
            -scheme SliccFollower \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery
      - name: Dead code detection (Periphery)
        run: |




          cd packages/ios-app && periphery scan \
            --project SliccFollower.xcodeproj \
            --schemes SliccFollower \
            --targets SliccFollower \
            --disable-update-check || true


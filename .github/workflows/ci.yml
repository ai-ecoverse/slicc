        if: matrix.ios == '26'
        run: |
          set -euo pipefail




          SKIP_SPECS="$(node packages/dev-tools/tools/ios-ui-test-exclusions.mjs --print-skip-args)"
          SKIP_ARGS=()
          while IFS= read -r spec; do



            if [ -n "$spec" ]; then SKIP_ARGS+=(--skip-testing "$spec"); fi
          done <<< "$SKIP_SPECS"
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device ${{ matrix.device }} \
            --result-bundle .build/ui-suite.xcresult \
            --only-testing SliccFollowerUITests \
            ${SKIP_ARGS[@]+"${SKIP_ARGS[@]}"}

      - name: Test transcript scroll anchoring (#2072, beta SDK)
        if: matrix.ios != '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device ${{ matrix.device }} \
            --result-bundle .build/transcript-anchor-ui.xcresult \
            --only-testing SliccFollowerUITests/TranscriptComposerGrowthUITests

      - name: Test transcript short actions (iPhone, beta SDK)
        if: matrix.device == 'iPhone' && matrix.ios != '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPhone \
            --result-bundle .build/transcript-short-actions-ui.xcresult \
            --only-testing SliccFollowerUITests/TranscriptShortActionsUITests
      - name: Test regular-width browser (iPad, beta SDK)
        if: matrix.device == 'iPad' && matrix.ios != '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPad \
            --result-bundle .build/regular-width-ui.xcresult \
            --only-testing SliccFollowerUITests/RemoteTabUITests/testRegularWidthBrowsingEntersAndExitsFullScreen
      - name: Test regular-width transcript column (iPad, beta SDK)
        if: matrix.device == 'iPad' && matrix.ios != '26'
        run: |
          ./packages/dev-tools/tools/ios-sim-test.sh \
            --device iPad \
            --result-bundle .build/transcript-column-ui.xcresult \
            --only-testing SliccFollowerUITests/TranscriptColumnUITests
      - name: Upload coverage report
        if: always() && matrix.device == 'iPhone' && matrix.ios == '26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-ios-app
          path: packages/ios-app/.build/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload test timings (xcresult)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-timings-ios-app-${{ matrix.ios }}-${{ matrix.device }}

          include-hidden-files: true
          path: |
            packages/ios-app/.build/coverage/ios-app.xcresult
            packages/ios-app/.build/*.xcresult
          if-no-files-found: ignore

  global-install:
    needs: changes
    if: >-
      needs.changes.outputs.cloud-core == 'true' ||
      needs.changes.outputs.node-server == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.root-config == 'true'
    runs-on: ubuntu-latest

    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - name: Build @slicc/shared-ts
        run: npm run build -w @slicc/shared-ts
      - name: Build node-server
        run: npm run build -w @slicc/node-server
      - name: Pack
        run: echo "tarball=$(npm pack --quiet | tail -1)" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Test global install
        env:
          npm_config_prefer_online: 'true'
        run: |
          set -o pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::npm install -g (attempt $i/$attempts)"
            status=0
            npm install -g "./${{ steps.pack.outputs.tarball }}" || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$i" -ge "$attempts" ]; then
              echo "global install failed (exit $status) after $attempts attempts" >&2
              exit "$status"
            fi
            delay=$((i * 15))
            echo "global install failed (exit $status) on attempt $i/$attempts; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          slicc --version
      - name: Test npx
        env:
          npm_config_prefer_online: 'true'
        run: |
          set -o pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "::group::npx (attempt $i/$attempts)"
            status=0
            npx --yes "sliccy@file:./${{ steps.pack.outputs.tarball }}" --version || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$i" -ge "$attempts" ]; then
              echo "npx failed (exit $status) after $attempts attempts" >&2
              exit "$status"
            fi
            delay=$((i * 15))
            echo "npx failed (exit $status) on attempt $i/$attempts; retrying in ${delay}s" >&2
            sleep "$delay"
          done

  bundle-size:
    needs: changes
    if: >-
      needs.changes.outputs.webapp == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.vfs-root == 'true' ||
      needs.changes.outputs.assets == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.spoon == 'true' ||
      needs.changes.outputs.webcomponents == 'true' ||
      needs.changes.outputs.cherry == 'true' ||
      needs.changes.outputs.dev-tools == 'true' ||
      needs.changes.outputs.root-config == 'true'
    runs-on: ubuntu-latest

    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - name: Build webapp
        run: npm run build -w @slicc/webapp
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
      - name: Build extension
        run: npm run build -w @slicc/chrome-extension
      - name: Check bundle-size budgets
        run: npm run bundle-size

  ci:
    name: ${{ (github.event_name == 'pull_request' && github.base_ref != 'main') && 'ci-stack' || 'ci' }}
    if: always()
    needs:
      [
        changes,
        lint,
        linear-history,
        typecheck,
        node-matrix-tests,
        webapp,
        e2e,
        node-server,
        chrome-extension,
        cloudflare-worker,
        cloud-core,
        shared,
        webcomponents,
        spoon,
        bundle-size,
        global-install,
        swift-launcher,
        swift-server,
        swift-optel,
        swift-traysession,
        swift-trayfollower,
        swift-traykit,
        swift-widgetkit,
        ios-app,
        ios-app-tests,
        go-optel,
        slicc-cli,
        github-workflow,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs failed or were cancelled"
            exit 1
          fi

    needs: [changes, lint]

    if: >-
      needs.lint.result == 'success' &&
      needs.changes.outputs.is-queue-leader == 'true' &&
      needs.changes.outputs.is-stacked == 'false' &&
      (needs.changes.outputs.ios-app == 'true' ||

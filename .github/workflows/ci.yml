      needs.changes.outputs.swift-trayfollower == 'true' ||
      needs.changes.outputs.swift-traykit == 'true' ||
      needs.changes.outputs.swift-widgetkit == 'true' ||
      needs.changes.outputs.swift-config == 'true')
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        ios: ['26', '27']
    runs-on: ${{ matrix.ios == '27' && 'xcode-27' || 'macos-latest' }}
    continue-on-error: ${{ matrix.ios == '27' }}

    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1


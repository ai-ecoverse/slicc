name: SLICC leader

# Reusable workflow: boot a SLICC hosted leader on a GitHub Actions runner,
# keep it alive for `duration`, optionally seed credentials / files / mounts,
# optionally run one prompt and collect its reply, the exported session, or a
# VFS file, and optionally lend the runner itself to the leader as an
# exec-capable follower. Composite actions + scripts live in
# packages/github-workflow/ (see its README for the input reference).
#
# Call it from another repo:
#   jobs:
#     slicc:
#       uses: ai-ecoverse/slicc/.github/workflows/slicc-leader.yml@main
#       with: { duration: 45m, prompt: 'Summarize /mnt/repo/README.md' }
#       secrets:
#         SLICC_CONE_CONFIG: ${{ secrets.SLICC_CONE_CONFIG }}
#
# Or, for a single API-key provider, `provider: anthropic` + the
# `SLICC_PROVIDER_API_KEY` secret instead of a whole bundle.
#
# The join URL is a bearer capability. With `mask-join-url: true` (default)
# it is redacted from logs and never leaves this job. Job outputs are only
# readable after the job — and therefore the leader — has ended, so they
# are useless for reaching a live leader. Instead, with `mask-join-url:
# false`, the URL is published as the `<artifact-prefix>-join` artifact
# right after boot; a parallel job in the same run can download it (retry
# until it exists) and use the `slicc-*.yml` workflows or actions against
# the running leader. Do that only in repos whose run logs and artifacts you
# treat as secret-bearing.

on:
  workflow_call:
    inputs:
      duration:
        description: Leader lifetime (`30m`, `2h`, `1h30m`; max 350m).
        type: string
        default: 30m
      prompt:
        description: Optional first prompt; the workflow waits for the turn to complete.
        type: string
        default: ''
      prompt-timeout:
        description: Wall-clock cap for the prompt turn.
        type: string
        default: 30m
      stop-after-prompt:
        description: Tear the leader down once the prompt completes instead of holding until `duration`.
        type: boolean
        default: false
      provider:
        description: Single-provider shortcut — provider id for one apikey account (`anthropic`, `openai`, `bedrock-camp`, …) using the `SLICC_PROVIDER_API_KEY` secret.
        type: string
        default: ''
      provider-base-url:
        description: Base URL for providers that need one (e.g. `https://bedrock-runtime.us-west-2.amazonaws.com`).
        type: string
        default: ''
      model:
        description: Model id override (`<provider>:<model>`).
        type: string
        default: ''
      effort-level:
        description: off|minimal|low|medium|high|xhigh
        type: string
        default: ''
      checkout:
        description: Check out the calling repository first (needed for `inject-path` / mounts under the workspace).
        type: boolean
        default: true
      inject-path:
        description: Directory (relative to the workspace) to copy into the VFS after boot.
        type: string
        default: ''
      inject-target:
        description: VFS directory that receives `inject-path`.
        type: string
        default: /
      mounts:
        description: Mount table, one `<runner-path>:<slicc-path>` per line.
        type: string
        default: ''
      fetch-file:
        description: VFS path to copy back as the `<artifact-prefix>-file` artifact.
        type: string
        default: ''
      export-session:
        description: Export the session transcript bundle as the `<artifact-prefix>-session` artifact.
        type: boolean
        default: false
      expose-follower:
        description: Lend this runner to the leader as an exec-capable follower.
        type: boolean
        default: false
      follower-runner:
        description: Runner argv for the follower (`bash -c`, `docker exec -i box sh -c`, …).
        type: string
        default: bash -c
      slicc-version:
        description: npm version of `sliccy` (node-server) to run.
        type: string
        default: latest
      cli-version:
        description: Release tag of the Go `slicc` CLI, or `latest`.
        type: string
        default: latest
      cli-source:
        description: "`release` downloads a published CLI binary; `build` compiles it from the `slicc-ref` checkout (this repo's smoke gate)."
        type: string
        default: release
      slicc-ref:
        description: Ref of ai-ecoverse/slicc to take the actions from.
        type: string
        default: main
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout; must exceed `duration` plus setup.
        type: number
        default: 360
      port:
        description: Local bridge port.
        type: string
        default: '5710'
      ui-origin:
        description: Hosted UI origin override.
        type: string
        default: ''
      tray-worker-base-url:
        description: Tray relay override.
        type: string
        default: ''
      mask-join-url:
        description: Redact the join URL. When false it is published as the `<artifact-prefix>-join` artifact while the leader runs.
        type: boolean
        default: true
      artifact-prefix:
        description: Prefix for uploaded artifacts.
        type: string
        default: slicc
    secrets:
      SLICC_CONE_CONFIG:
        description: JSON `{model?, effortLevel?, accounts[], secrets[]}` bundle.
        required: false
      SLICC_SECRETS_ENV:
        description: secrets.env text (`NAME=value` + `NAME_DOMAINS=…`).
        required: false
      SLICC_PROVIDER_API_KEY:
        description: API key for the `provider` shortcut.
        required: false
    outputs:
      tray-id:
        description: Tray id.
        value: ${{ jobs.leader.outputs.tray-id }}
      slicc-version:
        description: SLICC version the leader reported.
        value: ${{ jobs.leader.outputs.slicc-version }}
      response:
        description: Assistant reply to `prompt` (truncated to 256 KB; full text in the response artifact).
        value: ${{ jobs.leader.outputs.response }}
      prompt-exit-code:
        description: Exit status of the prompt turn.
        value: ${{ jobs.leader.outputs.prompt-exit-code }}
  workflow_dispatch:
    inputs:
      duration:
        description: Leader lifetime (`30m`, `2h`).
        default: 30m
      prompt:
        description: Optional first prompt.
        default: ''
      inject-path:
        description: Workspace directory to copy into the VFS.
        default: ''
      mounts:
        description: Mount table, one `<runner-path>:<slicc-path>` per line.
        default: ''
      fetch-file:
        description: VFS path to copy back as an artifact.
        default: ''
      export-session:
        description: Export the session bundle.
        type: boolean
        default: false
      expose-follower:
        description: Lend this runner to the leader as a follower.
        type: boolean
        default: false
      model:
        description: Model id override.
        default: ''
      slicc-version:
        description: npm version of `sliccy`.
        default: latest
      mask-join-url:
        description: Redact the join URL.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  leader:
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 360 }}
    outputs:
      tray-id: ${{ steps.start.outputs.tray-id }}
      slicc-version: ${{ steps.start.outputs.slicc-version }}
      response: ${{ steps.prompt.outputs.response }}
      prompt-exit-code: ${{ steps.prompt.outputs.exit-code }}
    steps:
      # The caller's repo first: a later checkout into `.` would `git clean`
      # the tools checkout away.
      - name: Check out the calling repository
        if: inputs.checkout || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the SLICC actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ai-ecoverse/slicc
          ref: ${{ inputs.slicc-ref || 'main' }}
          path: .slicc-gw
          sparse-checkout: |
            packages/github-workflow
            packages/slicc-cli
            packages/go-optel
          persist-credentials: false

      - name: Start leader
        id: start
        uses: ./.slicc-gw/packages/github-workflow/actions/start-leader
        with:
          slicc-version: ${{ inputs.slicc-version || 'latest' }}
          port: ${{ inputs.port || '5710' }}
          duration: ${{ inputs.duration || '30m' }}
          mounts: ${{ inputs.mounts }}
          cone-config: ${{ secrets.SLICC_CONE_CONFIG }}
          secrets-env: ${{ secrets.SLICC_SECRETS_ENV }}
          model: ${{ inputs.model }}
          effort-level: ${{ inputs.effort-level }}
          provider: ${{ inputs.provider }}
          provider-api-key: ${{ secrets.SLICC_PROVIDER_API_KEY }}
          provider-base-url: ${{ inputs.provider-base-url }}
          ui-origin: ${{ inputs.ui-origin }}
          tray-worker-base-url: ${{ inputs.tray-worker-base-url }}
          mask-join-url: ${{ inputs.mask-join-url != false }}

      # Published while the leader is alive so a parallel job can reach it;
      # only when the caller opted out of masking (see the header comment).
      - name: Publish the join URL for parallel jobs
        if: inputs.mask-join-url == false
        run: |
          mkdir -p "$RUNNER_TEMP/slicc-gw/join"
          printf '{"joinUrl":"%s","trayId":"%s"}\n' "$JOIN_URL" "$TRAY_ID" > "$RUNNER_TEMP/slicc-gw/join/join.json"
        env:
          JOIN_URL: ${{ steps.start.outputs.join-url }}
          TRAY_ID: ${{ steps.start.outputs.tray-id }}
      - if: inputs.mask-join-url == false
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix || 'slicc' }}-join
          path: ${{ runner.temp }}/slicc-gw/join/join.json

      - uses: actions/setup-go@v7
        if: inputs.cli-source == 'build'
        with:
          go-version-file: .slicc-gw/packages/slicc-cli/go.mod
          cache-dependency-path: .slicc-gw/packages/slicc-cli/go.sum
      - name: Install the slicc CLI
        uses: ./.slicc-gw/packages/github-workflow/actions/install-cli
        with:
          source: ${{ inputs.cli-source || 'release' }}
          build-dir: .slicc-gw/packages/slicc-cli
          version: ${{ inputs.cli-version || 'latest' }}

      - name: Inject files into the VFS
        if: inputs.inject-path != ''
        uses: ./.slicc-gw/packages/github-workflow/actions/inject-files
        with:
          join-url: ${{ steps.start.outputs.join-url }}
          source: ${{ github.workspace }}/${{ inputs.inject-path }}
          target: ${{ inputs.inject-target || '/' }}

      - name: Expose this runner as a follower
        if: inputs.expose-follower
        uses: ./.slicc-gw/packages/github-workflow/actions/follow
        with:
          join-url: ${{ steps.start.outputs.join-url }}
          runner: ${{ inputs.follower-runner || 'bash -c' }}

      - name: Prompt
        id: prompt
        if: inputs.prompt != ''
        continue-on-error: true
        uses: ./.slicc-gw/packages/github-workflow/actions/prompt
        with:
          join-url: ${{ steps.start.outputs.join-url }}
          prompt: ${{ inputs.prompt }}
          timeout: ${{ inputs.prompt-timeout || '30m' }}
          output-file: ${{ runner.temp }}/slicc-gw/out/response.md

      - name: Upload response
        if: inputs.prompt != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix || 'slicc' }}-response
          path: ${{ runner.temp }}/slicc-gw/out/response.md
          if-no-files-found: ignore

      - name: Export session
        if: inputs.export-session
        uses: ./.slicc-gw/packages/github-workflow/actions/export-session
        with:
          join-url: ${{ steps.start.outputs.join-url }}
          local: ${{ runner.temp }}/slicc-gw/out/session.zip

      - name: Upload session
        if: inputs.export-session
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix || 'slicc' }}-session
          path: ${{ runner.temp }}/slicc-gw/out/session.zip

      - name: Fetch VFS file
        if: inputs.fetch-file != ''
        uses: ./.slicc-gw/packages/github-workflow/actions/read-file
        with:
          join-url: ${{ steps.start.outputs.join-url }}
          path: ${{ inputs.fetch-file }}
          local: ${{ runner.temp }}/slicc-gw/out/fetched/${{ inputs.fetch-file }}

      - name: Upload VFS file
        if: inputs.fetch-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix || 'slicc' }}-file
          path: ${{ runner.temp }}/slicc-gw/out/fetched

      - name: Keep the leader alive until the deadline
        if: ${{ !(inputs.stop-after-prompt && inputs.prompt != '') }}
        uses: ./.slicc-gw/packages/github-workflow/actions/keep-alive

      - name: Stop leader
        if: always()
        uses: ./.slicc-gw/packages/github-workflow/actions/stop-leader

      - name: Upload leader logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix || 'slicc' }}-leader-logs
          path: ${{ runner.temp }}/slicc-gw/*.log
          if-no-files-found: ignore

      - name: Fail if the prompt failed
        if: inputs.prompt != '' && steps.prompt.outcome != 'success'
        run: |
          echo "::error::prompt step ${{ steps.prompt.outcome }} (exit ${{ steps.prompt.outputs.exit-code }})"
          exit 1

name: Copy repo secrets to org secrets

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Comma-separated secret names to copy, e.g. TURN_KEY_ID,TURN_KEY_API_TOKEN'
        required: true
      visibility:
        description: 'Visibility of the org secrets'
        type: choice
        options:
          - selected
          - private
          - all
        default: selected
      repositories:
        description: 'Comma-separated repository names that may use the secrets (visibility "selected" only)'
        required: false
        default: ''
      overwrite:
        description: 'Replace org secrets that already exist'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: copy-secrets-to-org
  cancel-in-progress: false

jobs:
  plan:
    if: github.actor == 'trieloff' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: org-secrets
    outputs:
      names: ${{ steps.plan.outputs.names }}
    steps:
      - id: plan
        name: Validate the request
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_PAT }}
          NAMES: ${{ inputs.names }}
          VISIBILITY: ${{ inputs.visibility }}
          REPOSITORIES: ${{ inputs.repositories }}
          OVERWRITE: ${{ inputs.overwrite }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_SECRETS_PAT is not set in the org-secrets environment"
            exit 1
          fi
          case "${VISIBILITY}" in
            selected|private|all) ;;
            *) echo "::error::Unknown visibility ${VISIBILITY}"; exit 1 ;;
          esac
          if [ "${VISIBILITY}" = selected ] && [ -z "${REPOSITORIES// /}" ]; then
            echo "::error::Visibility \"selected\" needs at least one repository"
            exit 1
          fi
          if [ "${VISIBILITY}" = selected ]; then
            IFS=',' read -ra repos <<< "${REPOSITORIES// /}"
            for repo in "${repos[@]}"; do
              [ -n "${repo}" ] || continue
              gh api "repos/${ORG}/${repo}" --jq .id > /dev/null || { echo "::error::Unknown repository ${ORG}/${repo}"; exit 1; }
            done
          fi
          existing="$(gh api --paginate "orgs/${ORG}/actions/secrets" --jq '.secrets[].name')"
          names=()
          IFS=',' read -ra raw <<< "${NAMES}"
          for entry in "${raw[@]}"; do
            name="$(printf '%s' "${entry}" | tr -d '[:space:]')"
            [ -n "${name}" ] || continue
            if ! [[ "${name}" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
              echo "::error::Invalid secret name ${name}"
              exit 1
            fi
            case "${name}" in
              ORG_SECRETS_PAT|GITHUB_TOKEN)
                echo "::error::Refusing to copy ${name}"
                exit 1 ;;
            esac
            if grep -qx "${name}" <<< "${existing}" && [ "${OVERWRITE}" != true ]; then
              echo "::error::Org secret ${name} already exists; dispatch again with overwrite to replace it"
              exit 1
            fi
            names+=("${name}")
          done
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::No secret names given"
            exit 1
          fi
          printf 'names=%s\n' "$(printf '%s\n' "${names[@]}" | sort -u | jq -R . | jq -sc .)" >> "${GITHUB_OUTPUT}"

  copy:
    needs: plan
    runs-on: ubuntu-latest
    environment: org-secrets
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - name: Copy ${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_PAT }}
          SECRET_VALUE: ${{ secrets[matrix.name] }}
          SECRET_NAME: ${{ matrix.name }}
          VISIBILITY: ${{ inputs.visibility }}
          REPOSITORIES: ${{ inputs.repositories }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::Secret ${SECRET_NAME} is not available to this repository"
            exit 1
          fi
          args=(--org "${ORG}" --visibility "${VISIBILITY}")
          scope=""
          if [ "${VISIBILITY}" = selected ]; then
            args+=(--repos "${REPOSITORIES// /}")
            scope=", repositories ${REPOSITORIES// /}"
          fi
          gh secret set "${SECRET_NAME}" "${args[@]}" --body "${SECRET_VALUE}"
          echo "Copied ${SECRET_NAME} to ${ORG} (visibility ${VISIBILITY}${scope})"
          echo "- \`${SECRET_NAME}\` → org secret, visibility ${VISIBILITY}${scope}" >> "${GITHUB_STEP_SUMMARY}"

name: Renovate Bundle-Size Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: renovate-bundle-size-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  MAX_GROWTH_KB: '50'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'renovate[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - name: Detect an npm dependency change
        id: scope
        run: |
          if git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
              | grep -qE '(^|/)package(-lock)?\.json$'; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "No package.json / package-lock.json change — nothing to measure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.scope.outputs.npm == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/npm-ci
        if: steps.scope.outputs.npm == 'true'

      - name: Build webapp
        if: steps.scope.outputs.npm == 'true'
        run: npm run build -w @slicc/webapp
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Build extension
        if: steps.scope.outputs.npm == 'true'
        run: npm run build -w @slicc/chrome-extension

      - name: Raise exceeded budgets
        id: raise
        if: steps.scope.outputs.npm == 'true'
        run: |
          set +e
          node packages/dev-tools/tools/bundle-budget-reconcile.mjs --write \
            --max-growth-kb="$MAX_GROWTH_KB" | tee reconcile.log
          status=${PIPESTATUS[0]}
          set -e
          { echo '### Bundle budgets'; echo '```'; cat reconcile.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo "outcome=blocked" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          elif git diff --quiet -- packages/webapp/package.json packages/chrome-extension/package.json; then
            echo "outcome=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=raised" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the raised budgets
        if: steps.raise.outputs.outcome == 'raised'
        run: |
          (cd packages/webapp && npx size-limit)
          (cd packages/chrome-extension && npx size-limit)

      - name: Comment a blocked raise
        if: steps.raise.outputs.outcome == 'blocked'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file - <<EOF
          📦 This bump grows a bundle budget by more than ${MAX_GROWTH_KB} kB, so I did not raise it automatically. A human needs to justify the growth (or shrink it) and raise the \`size-limit\` budget by hand.

          \`\`\`
          $(cat reconcile.log)
          \`\`\`

          See \`.github/workflows/renovate-bundle-size-reconcile.yml\`.
          EOF
          exit 1

      - name: Comment the raise
        if: steps.raise.outputs.outcome == 'raised'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file - <<EOF
          📦 This dependency bump grows the bundle past its \`size-limit\` budget by less than ${MAX_GROWTH_KB} kB, so I raised the budget to the measured size (rounded up to the next kB) and am pushing it:

          \`\`\`
          $(cat reconcile.log)
          \`\`\`

          See \`.github/workflows/renovate-bundle-size-reconcile.yml\`.
          EOF

      - name: Push the raised budgets
        if: steps.raise.outputs.outcome == 'raised'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/webapp/package.json packages/chrome-extension/package.json
          git commit -m "chore(deps): raise bundle-size budget for dependency bump (renovate-bundle-size-reconcile)"
          git push

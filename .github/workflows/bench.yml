# Benchmark: run task sets on hosted SLICC leaders across models and skills, judge every run,
# and publish browser-use-style result files plus a report (packages/bench/README.md).
#
# - workflow_dispatch: a full run. Sets are `bu-v1` (BU Bench V1, answered tasks), `bu-v2`
#   (BU Bench V2.1), or a task-set JSON path in this repo; skills conditions are `none`,
#   `builtin`, and `builtin+ecoverse` (the leader's skills plus ai-ecoverse/skills, mounted from a
#   checkout).
# - pull_request touching the runner (or the CLI verbs it drives): the smoke task on both models,
#   twice, on two leaders in one job, so the whole path (lanes, cone, screenshots, judge, restart,
#   merge, report) is exercised before merge. Same-repo heads only: fork PRs get no Bedrock key.
#
# Shape: `plan` pins the sliccy version and lists the shards; each `bench` shard is one matrix job
# on a self-hosted GCP runner (Cyclenerd/google-cloud-github-runner in ai-ecoverse-493315;
# `runs-on` names its GCE instance template) that takes every Nth task (`run.mjs --shard K/N`)
# and runs it on `leaders` leaders side by side; `report` merges the shards' out dirs
# (merge.mjs), and publishes once. The shards and `report` (on `vars.BENCH_SMALL_RUNNER`, default
# gcp-ubuntu-24-04-2core) run on GCP; `plan`, a few seconds, runs GitHub-hosted so its VM cannot
# take quota the shards need.
#
# Guardrails, so a job never goes stale or runs out its time limit with nothing saved:
# - run.mjs stops taking runs once one might not finish before `--deadline-minutes`, stops a run
#   that spends more than `max-task-cost`, and stops a shard at `max-cost`; what is left is
#   journaled for a resume.
# - the run step has its own time limit below the job's, so the diagnostics and uploads after it
#   always run; `report` runs whenever any shard left an artifact, and "Re-run failed jobs"
#   resumes a shard from its artifact. `resume-run` continues an earlier run in a new one (for
#   other settings, such as another runner template).
# - bench-reaper.yml cancels runs whose shards wait for a runner that never comes, or outlive
#   the job limit.
#
# Traces of upstream sets hold decrypted task text; the runner Fernet-encrypts them with the set's
# own key before they are uploaded, as browser-use publishes its tasks.
#
# Artifacts: `bench-<run>-shard-<k>` (each shard's out dir), `bench-<run>` (merged, with traces)
# and `bench-report-<run>` (report.md, report.json, report.html, results/). A dispatch run also
# publishes to the Hugging Face dataset ai-ecoverse/slicc-bench (packages/bench/scripts/publish.mjs):
# scores for every set, and encrypted traces and task sets for SLICC's own sets only.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'Task sets, space-separated: bu-v1, bu-v2, or task-set JSON paths'
        default: 'packages/bench/tasks/smoke.json'
      models:
        description: 'Models, comma-separated (pi-ai aliases)'
        default: 'claude-sonnet-5,claude-opus-5-5'
      skills:
        description: 'Skills conditions, comma-separated: none, builtin, builtin+ecoverse'
        default: 'builtin,none'
      repeats:
        description: 'Runs per task, model and skills condition'
        default: '1'
      tasks:
        description: 'Only these task ids, comma-separated (empty: all)'
        default: ''
      limit:
        description: 'Only the first N tasks of each set (empty: all)'
        default: ''
      timeout:
        description: 'Seconds one agent run may take (BU Bench V2.1: 3600)'
        default: '900'
      judge-model:
        description: 'Bedrock model that judges the runs'
        default: 'global.openai.gpt-5.6-luna'
      skills-ref:
        description: 'ai-ecoverse/skills ref for the ecoverse skills condition'
        default: 'main'
      shards:
        description: 'Matrix jobs; each takes every Nth task (1-20)'
        default: '3'
      max-parallel:
        description: "Shards running at once (3 × 8 vCPU fills the project's E2 quota of 24)"
        default: '3'
      leaders:
        description: 'Leaders per shard, side by side (1-8; about 2 vCPU each)'
        default: '4'
      runner:
        description: 'GCE instance template the shards run on (runs-on label)'
        default: 'gcp-bench-8core'
      resume-run:
        description: "Continue an earlier Benchmark run (its run id): each shard starts from that run's shard artifact. Use the same sets, tasks, models, skills, repeats and shards"
        default: ''
      deadline-minutes:
        description: 'Minutes a shard takes new runs for (its job limit is this plus 45)'
        default: '300'
      max-task-cost:
        description: 'Dollars one run may spend before it is stopped (0: no cap)'
        default: '5'
      max-cost:
        description: 'Dollars one shard may spend before it stops taking runs (0: no cap)'
        default: '150'
      fresh-leader-every:
        description: 'Restart a leader every N tasks with a wiped profile (1: every task is isolated; 0: never)'
        default: '1'
      publish:
        description: 'Publish the results to the Hugging Face dataset ai-ecoverse/slicc-bench'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'packages/bench/**'
      - 'packages/slicc-cli/session.go'
      - 'packages/github-workflow/scripts/start-leader.mjs'
      - 'packages/github-workflow/scripts/stop-leader.mjs'
      - '.github/workflows/bench.yml'

concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted: it takes seconds, and a GCP VM for it still exists while the shards ask for
    # theirs. Three 8-core shards fill the project's 24 E2 vCPUs exactly, so the plan's 2 vCPUs
    # pushed two of them into QUOTA_EXCEEDED (V2.1 pilot, 2026-09-26).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      slicc-version: ${{ steps.plan.outputs.slicc-version }}
      run-minutes: ${{ steps.plan.outputs.run-minutes }}
      job-minutes: ${{ steps.plan.outputs.job-minutes }}
    env:
      SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shards || '1' }}
      DEADLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.deadline-minutes || '45' }}
      RESUME_RUN: ${{ inputs.resume-run || '' }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Every shard and every leader restart runs the same sliccy, even if one is published
      # mid-run: the records are comparable only within one harness version.
      - name: Pin the sliccy version and list the shards
        id: plan
        run: |
          set -euo pipefail
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be 1 to 20, not '$SHARDS'"; exit 1
          fi
          if [ -n "$RESUME_RUN" ] && ! [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::resume-run must be a run id, not '$RESUME_RUN'"; exit 1
          fi
          if ! [[ "$DEADLINE" =~ ^[0-9]+$ ]] || [ "$DEADLINE" -lt 10 ] || [ "$DEADLINE" -gt 1380 ]; then
            echo "::error::deadline-minutes must be 10 to 1380, not '$DEADLINE'"; exit 1
          fi
          # Expressions can't add: the run step gets the deadline plus 20 minutes for the runs in
          # flight, the job 25 more for setup, diagnostics and the upload.
          echo "run-minutes=$((DEADLINE + 20))" >> "$GITHUB_OUTPUT"
          echo "job-minutes=$((DEADLINE + 45))" >> "$GITHUB_OUTPUT"
          version="$(npm view sliccy@latest version)"
          echo "slicc-version=$version" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "sliccy $version, $SHARDS shard(s)" >> "$GITHUB_STEP_SUMMARY"

  bench:
    name: Shard ${{ matrix.shard }}
    needs: plan
    permissions:
      contents: read
      actions: read # resume-run downloads another run's shard artifacts
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || vars.BENCH_PR_RUNNER || 'gcp-ubuntu-24-04-4core' }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job-minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.max-parallel) || 1 }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      BENCH_SETS: ${{ github.event_name == 'workflow_dispatch' && inputs.sets || 'packages/bench/tasks/smoke.json' }}
      BENCH_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || 'claude-sonnet-5,claude-opus-5-5' }}
      BENCH_SKILLS: ${{ github.event_name == 'workflow_dispatch' && inputs.skills || 'builtin' }}
      BENCH_REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeats || '2' }}
      BENCH_TASKS: ${{ github.event_name == 'workflow_dispatch' && inputs.tasks || 'smoke-001' }}
      BENCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      BENCH_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout || '600' }}
      BENCH_JUDGE_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.judge-model || 'global.openai.gpt-5.6-luna' }}
      BENCH_FRESH_LEADER_EVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh-leader-every || '1' }}
      BENCH_LEADERS: ${{ github.event_name == 'workflow_dispatch' && inputs.leaders || '2' }}
      BENCH_DEADLINE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.deadline-minutes || '45' }}
      BENCH_MAX_TASK_COST: ${{ github.event_name == 'workflow_dispatch' && inputs.max-task-cost || '2' }}
      BENCH_MAX_COST: ${{ github.event_name == 'workflow_dispatch' && inputs.max-cost || '10' }}
      BENCH_SHARD: ${{ matrix.shard }}/${{ github.event_name == 'workflow_dispatch' && inputs.shards || '1' }}
      SLICC_VERSION: ${{ needs.plan.outputs.slicc-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out ai-ecoverse/skills for the ecoverse condition
        if: contains(env.BENCH_SKILLS, 'ecoverse')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ai-ecoverse/skills
          ref: ${{ inputs.skills-ref || 'main' }}
          path: bench-skills-repo

      - name: Mount table
        id: mounts
        run: |
          if [ -d bench-skills-repo/skills ]; then
            echo "mounts=$GITHUB_WORKSPACE/bench-skills-repo/skills:/workspace/bench-skills/ecoverse" >> "$GITHUB_OUTPUT"
          else
            echo "mounts=" >> "$GITHUB_OUTPUT"
          fi

      # node-server needs Node >= 22.18; the GCP image ships an older apt nodejs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The GCP image has no browser. The .deb pulls in the libraries Chrome needs, which a bare
      # image lacks; GitHub-hosted images already have Chrome.
      - name: Install Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; exit 0; fi
          curl -fsSL -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP/chrome.deb" fonts-liberation
          google-chrome --version

      # Hosted bootstrap reads /slicc/cone-config.json; every lane's start-leader writes it.
      - name: Prepare /slicc
        run: |
          if [ -w /slicc ] 2>/dev/null; then exit 0; fi
          sudo mkdir -p /slicc && sudo chown "$(id -u)" /slicc

      # "Re-run failed jobs" resumes a shard: its last artifact holds the records, and run.mjs
      # only runs (or re-judges) what they lack.
      - name: Resume from the previous attempt
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bench-out

      # `resume-run` continues another run, for example one whose shards need other settings (a
      # different runner). The shard plan must match, which the same inputs guarantee; a shard
      # the earlier run never uploaded starts fresh.
      - name: Resume from an earlier run
        if: github.run_attempt == '1' && inputs.resume-run != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-${{ inputs.resume-run }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bench-out
          run-id: ${{ inputs.resume-run }}
          github-token: ${{ github.token }}

      # The runner drives the leaders with `new-session` and `model`, which ship with this ref's
      # CLI and not necessarily with the last release: build it from the checkout.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/slicc-cli/go.mod
          cache-dependency-path: packages/slicc-cli/go.sum

      - name: Install the slicc CLI (built from this checkout)
        uses: ./packages/github-workflow/actions/install-cli
        with:
          source: build

      # run.mjs boots `BENCH_LEADERS` leaders itself (one home and port each, boots one at a
      # time) with the start-leader and stop-leader scripts, restarts them every
      # BENCH_FRESH_LEADER_EVERY tasks and when one stops answering, and stops them at the end.
      # The INPUT_* below are what those scripts read. The step's own limit sits below the
      # job's so the uploads after it still run if a leader call hangs past the deadline.
      - name: Run and judge
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.run-minutes) }}
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BEDROCK_REGION: ${{ vars.RUM_AWS_REGION || 'us-west-2' }}
          BENCH_LEADER_SCRIPTS: packages/github-workflow/scripts
          INPUT_SLICC_VERSION: ${{ needs.plan.outputs.slicc-version }}
          INPUT_DURATION: 350m
          INPUT_MOUNTS: ${{ steps.mounts.outputs.mounts }}
          INPUT_PROVIDER: bedrock-camp
          INPUT_PROVIDER_API_KEY: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          INPUT_PROVIDER_BASE_URL: https://bedrock-runtime.${{ vars.RUM_AWS_REGION || 'us-west-2' }}.amazonaws.com
          INPUT_MODEL: bedrock-camp:global.anthropic.claude-sonnet-5
          INPUT_MASK_JOIN_URL: 'true'
        run: |
          set -euo pipefail
          args=(--models "$BENCH_MODELS" --skills "$BENCH_SKILLS" --repeats "$BENCH_REPEATS"
                --timeout "$BENCH_TIMEOUT" --judge-model "$BENCH_JUDGE_MODEL"
                --leaders "$BENCH_LEADERS" --boot-leaders --shard "$BENCH_SHARD"
                --fresh-leader-every "$BENCH_FRESH_LEADER_EVERY"
                --deadline-minutes "$BENCH_DEADLINE_MINUTES"
                --max-task-cost "$BENCH_MAX_TASK_COST" --max-cost "$BENCH_MAX_COST"
                --harness "$SLICC_VERSION" --out "$RUNNER_TEMP/bench-out")
          for set in $BENCH_SETS; do args+=(--set "$set"); done
          if [ -n "$BENCH_TASKS" ]; then args+=(--tasks "$BENCH_TASKS"); fi
          if [ -n "$BENCH_LIMIT" ]; then args+=(--limit "$BENCH_LIMIT"); fi
          node packages/bench/scripts/run.mjs "${args[@]}"

      # Each leader's side of its connections, for diagnosing a leader that stops answering:
      # tray, signaling and WebRTC lines plus the runner's [bench-event] markers, no page
      # traffic, tokens redacted. The journal (calls.jsonl, events.jsonl, diagnostics/) is
      # already in the out dir.
      - name: Collect leader diagnostics
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/bench-out"
          mkdir -p "$out"
          found=0
          for log in "$RUNNER_TEMP"/slicc-gw-lane*/leader.log; do
            [ -f "$log" ] || continue
            found=1
            lane="$(basename "$(dirname "$log")")"
            grep -v '\[cdp-proxy\]' "$log" \
              | grep -iE 'bench-event|tray|signal|follower|controller|bootstrap|webrtc|ice|turn|dtls|sctp|data ?channel|peer|reconnect|disconnect|websocket|heartbeat|start-leader|stop-leader' \
              | sed -E 's#/(join|controller|webhook)/[^ /"?]+#/\1/<token>#g' \
              | cut -c1-400 > "$out/leader-infra-$lane.log" || true
            {
              echo "$lane leader log lines: $(wc -l < "$log")"
              echo "$lane cdp-proxy lines: $(grep -c '\[cdp-proxy\]' "$log" || true)"
              echo "$lane infra lines kept: $(wc -l < "$out/leader-infra-$lane.log")"
            } | tee -a "$out/leader-log-stats.txt"
          done
          [ "$found" = 1 ] || echo "no leader logs"

      # Whatever the run step left, including after its own time limit.
      - name: Stop leaders
        if: always()
        timeout-minutes: 5
        run: |
          for home in "$RUNNER_TEMP"/slicc-gw-lane*; do
            [ -f "$home/state.json" ] || continue
            SLICC_GW_HOME="$home" node packages/github-workflow/scripts/stop-leader.mjs || true
          done

      - name: Upload the shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bench-out
          if-no-files-found: ignore

  report:
    name: Report
    needs: [plan, bench]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ${{ vars.BENCH_SMALL_RUNNER || 'gcp-ubuntu-24-04-2core' }}
    timeout-minutes: 30
    env:
      BENCH_SETS: ${{ github.event_name == 'workflow_dispatch' && inputs.sets || 'packages/bench/tasks/smoke.json' }}
      BENCH_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || 'claude-sonnet-5,claude-opus-5-5' }}
      BENCH_SKILLS: ${{ github.event_name == 'workflow_dispatch' && inputs.skills || 'builtin' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-${{ github.run_id }}-shard-*
          path: ${{ runner.temp }}/shards

      - name: Merge the shards
        id: merge
        run: |
          set -euo pipefail
          shards=()
          for d in "$RUNNER_TEMP"/shards/bench-*-shard-*/; do [ -d "$d" ] && shards+=("$d"); done
          # A single matching artifact is extracted straight into the path, without its own
          # directory.
          if [ ${#shards[@]} -eq 0 ] && [ -n "$(ls -A "$RUNNER_TEMP/shards" 2>/dev/null)" ]; then
            shards=("$RUNNER_TEMP/shards")
          fi
          if [ ${#shards[@]} -eq 0 ]; then echo "::error::no shard left an artifact"; exit 1; fi
          node packages/bench/scripts/merge.mjs --out "$RUNNER_TEMP/bench-out" "${shards[@]}"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bench-out/report.md
            ${{ runner.temp }}/bench-out/report.json
            ${{ runner.temp }}/bench-out/report.html
            ${{ runner.temp }}/bench-out/results
          if-no-files-found: ignore

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-out
          if-no-files-found: ignore

      # Ubuntu 24.04 refuses a system-wide pip install (PEP 668); the hf CLI gets its own Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        with:
          python-version: '3.13'

      # Publishes whatever finished, even when some shards errored or stopped early. The combined
      # report is rebuilt from the dataset's records plus this run's.
      - name: Publish to Hugging Face
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          BENCH_DATASET: ai-ecoverse/slicc-bench
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret is not set"; exit 1; fi
          if [ ! -d "$RUNNER_TEMP/bench-out/records" ]; then echo "no records to publish"; exit 0; fi
          python3 -m pip install --quiet 'huggingface_hub==2.0.0'
          run_name="$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hf download "$BENCH_DATASET" --repo-type dataset --include 'records/**' \
            --local-dir "$RUNNER_TEMP/hf-current"
          args=(--out "$RUNNER_TEMP/bench-out" --stage "$RUNNER_TEMP/hf-stage" --run "$run_name"
                --dataset "$RUNNER_TEMP/hf-current")
          for set in $BENCH_SETS; do args+=(--set "$set"); done
          node packages/bench/scripts/publish.mjs "${args[@]}"
          # publish.mjs writes the full cleaned records/ tree; --delete drops Hub paths that
          # a new upstream pin left behind so the next download cannot mix task versions.
          hf upload "$BENCH_DATASET" "$RUNNER_TEMP/hf-stage" . --repo-type dataset \
            --delete 'records/**' \
            --commit-message "Run $run_name: $BENCH_MODELS × $BENCH_SKILLS"
          echo "Published to https://huggingface.co/datasets/$BENCH_DATASET/tree/main/runs/$run_name" >> "$GITHUB_STEP_SUMMARY"

      # A shard that failed or stopped early fails the run, after everything above is saved.
      - name: Fail if a shard did not finish
        if: needs.bench.result != 'success'
        run: |
          echo "::error::at least one shard failed or stopped early (${{ needs.bench.result }}); use \"Re-run failed jobs\" to resume them from their artifacts"
          exit 1

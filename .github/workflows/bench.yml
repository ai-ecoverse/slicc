# Benchmark: run task sets on a hosted SLICC leader across models and skills, judge every run,
# and publish browser-use-style result files plus a report (packages/bench/README.md).
#
# - workflow_dispatch: a full run. Sets are `bu-v1` (BU Bench V1, answered tasks), `bu-v2`, or a
#   task-set JSON path in this repo; skills conditions are `none`, `builtin`, and `builtin+ecoverse`
#   (the leader's skills plus ai-ecoverse/skills, mounted from a checkout).
# - pull_request touching the runner: one smoke task on both models, so the whole path (leader,
#   agent, screenshots, judge, report) is exercised before merge. Same-repo heads only: fork PRs
#   get no Bedrock key.
#
# Traces of upstream sets hold decrypted task text; the runner Fernet-encrypts them with the set's
# own key before they are uploaded, as browser-use publishes its tasks.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'Task sets, space-separated: bu-v1, bu-v2, or task-set JSON paths'
        default: 'packages/bench/tasks/smoke.json'
      models:
        description: 'Models, comma-separated (pi-ai aliases)'
        default: 'claude-sonnet-5,claude-opus-5-5'
      skills:
        description: 'Skills conditions, comma-separated: none, builtin, builtin+ecoverse'
        default: 'builtin,none'
      repeats:
        description: 'Runs per task, model and skills condition'
        default: '1'
      tasks:
        description: 'Only these task ids, comma-separated (empty: all)'
        default: ''
      limit:
        description: 'Only the first N tasks of each set (empty: all)'
        default: ''
      timeout:
        description: 'Seconds one agent run may take'
        default: '900'
      judge-model:
        description: 'Bedrock model that judges the runs'
        default: 'global.openai.gpt-5.6-luna'
      skills-ref:
        description: 'ai-ecoverse/skills ref for the ecoverse skills condition'
        default: 'main'
      duration:
        description: 'Leader lifetime (max 350m)'
        default: '5h'
  pull_request:
    paths:
      - 'packages/bench/**'
      - '.github/workflows/bench.yml'

concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 355 || 45 }}
    env:
      BENCH_SETS: ${{ github.event_name == 'workflow_dispatch' && inputs.sets || 'packages/bench/tasks/smoke.json' }}
      BENCH_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || 'claude-sonnet-5,claude-opus-5-5' }}
      BENCH_SKILLS: ${{ github.event_name == 'workflow_dispatch' && inputs.skills || 'builtin' }}
      BENCH_REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeats || '1' }}
      BENCH_TASKS: ${{ github.event_name == 'workflow_dispatch' && inputs.tasks || 'smoke-001' }}
      BENCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
      BENCH_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.timeout || '600' }}
      BENCH_JUDGE_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.judge-model || 'global.openai.gpt-5.6-luna' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out ai-ecoverse/skills for the ecoverse condition
        if: contains(env.BENCH_SKILLS, 'ecoverse')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ai-ecoverse/skills
          ref: ${{ inputs.skills-ref || 'main' }}
          path: bench-skills-repo

      - name: Mount table
        id: mounts
        run: |
          if [ -d bench-skills-repo/skills ]; then
            echo "mounts=$GITHUB_WORKSPACE/bench-skills-repo/skills:/workspace/bench-skills/ecoverse" >> "$GITHUB_OUTPUT"
          else
            echo "mounts=" >> "$GITHUB_OUTPUT"
          fi

      - name: Start leader
        id: start
        uses: ./packages/github-workflow/actions/start-leader
        with:
          duration: ${{ github.event_name == 'workflow_dispatch' && inputs.duration || '40m' }}
          mounts: ${{ steps.mounts.outputs.mounts }}
          provider: bedrock-camp
          provider-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          provider-base-url: https://bedrock-runtime.${{ vars.RUM_AWS_REGION || 'us-west-2' }}.amazonaws.com
          model: bedrock-camp:global.anthropic.claude-sonnet-5

      - name: Install the slicc CLI
        uses: ./packages/github-workflow/actions/install-cli

      - name: Run and judge
        env:
          SLICC_JOIN_URL: ${{ steps.start.outputs.join-url }}
          SLICC_VERSION: ${{ steps.start.outputs.slicc-version }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BEDROCK_REGION: ${{ vars.RUM_AWS_REGION || 'us-west-2' }}
        run: |
          set -euo pipefail
          args=(--models "$BENCH_MODELS" --skills "$BENCH_SKILLS" --repeats "$BENCH_REPEATS"
                --timeout "$BENCH_TIMEOUT" --judge-model "$BENCH_JUDGE_MODEL"
                --harness "${SLICC_VERSION:-unknown}" --out "$RUNNER_TEMP/bench-out")
          for set in $BENCH_SETS; do args+=(--set "$set"); done
          if [ -n "$BENCH_TASKS" ]; then args+=(--tasks "$BENCH_TASKS"); fi
          if [ -n "$BENCH_LIMIT" ]; then args+=(--limit "$BENCH_LIMIT"); fi
          node packages/bench/scripts/run.mjs "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-out
          if-no-files-found: ignore

      - name: Stop leader
        if: always()
        uses: ./packages/github-workflow/actions/stop-leader

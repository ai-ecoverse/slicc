version: '2'

run:
  timeout: 5m

linters:
  enable:
    - funlen
    - gocyclo
    - gocognit
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    funlen:
      lines: 120
      statements: 70
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 30
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Write
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit

formatters:
  enable:
    - gofmt

name: SliccFollower
options:
  bundleIdPrefix: com.sliccy
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
    SUPPORTS_MACCATALYST: NO
targets:
  SliccFollower:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower
        # Test sources (XCTest) must not compile into the app target — they
        # belong to the SliccFollowerTests bundle below, and the app target
        # globs all of SliccFollower/.
        excludes:
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: SliccFollower
        SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 'This app does not access the camera. This entry is required because the bundled WebRTC framework references camera APIs.'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - package: WebRTC
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
  SliccFollowerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerTests
    dependencies:
      - target: SliccFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.tests
  SliccFollowerUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerUITests
    dependencies:
      - target: SliccFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.uitests
        TEST_TARGET_NAME: SliccFollower
schemes:
  SliccFollower:
    build:
      targets:
        SliccFollower: all
        SliccFollowerTests: [test]
        SliccFollowerUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - SliccFollower
      targets:
        - name: SliccFollowerTests
          parallelizable: true
          randomExecutionOrder: true
        # Serial on purpose. Each UI test is independent — it launches its own
        # app process with its own launch arguments — but cloning simulators
        # for a UI bundle races the runner install, and the clone that loses
        # fails preflight with "Busy" before any test runs. Random order still
        # holds, so the independence these tests are written for stays enforced.
        - name: SliccFollowerUITests
          parallelizable: false
          randomExecutionOrder: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0

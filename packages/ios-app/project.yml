name: SliccFollower
options:
  bundleIdPrefix: com.sliccy
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
    SUPPORTS_MACCATALYST: NO
targets:
  SliccFollower:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower
        # Test sources (XCTest) must not compile into the app target — they
        # belong to the SliccFollowerTests bundle below, and the app target
        # globs all of SliccFollower/.
        excludes:
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_NAME: SliccFollower
        SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 'Take a photo to attach it to your message.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Hold the message field to dictate a message with your voice.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Dictated audio is transcribed on this device when possible to fill the message field.'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iCloud KVS for tray-session discovery. The App Store provisioning
        # profile must carry the iCloud capability; dev/simulator builds
        # without it still run — the store degrades to a local cache.
        CODE_SIGN_ENTITLEMENTS: SliccFollower/SliccFollower.entitlements
    dependencies:
      - package: WebRTC
      - package: SliccTraySession
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
  SliccFollowerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerTests
    dependencies:
      - target: SliccFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.tests
  SliccFollowerUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerUITests
    dependencies:
      - target: SliccFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.uitests
        TEST_TARGET_NAME: SliccFollower
schemes:
  SliccFollower:
    build:
      targets:
        SliccFollower: all
        SliccFollowerTests: [test]
        SliccFollowerUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - SliccFollower
      targets:
        # Also serial, for the UI bundle's sake rather than its own. The 47
        # unit tests total ~7s, so parallelizing them saves seconds, while the
        # simulator clones it spawns compete with the UI runner's startup and
        # leave it dying on "Timed out while loading Accessibility". Random
        # order still holds, so test independence stays enforced.
        - name: SliccFollowerTests
          parallelizable: false
          randomExecutionOrder: true
        # Serial on purpose. Each UI test is independent — it launches its own
        # app process with its own launch arguments — but cloning simulators
        # for a UI bundle races the runner install, and the clone that loses
        # fails preflight with "Busy" before any test runs. Random order still
        # holds, so the independence these tests are written for stays enforced.
        - name: SliccFollowerUITests
          parallelizable: false
          randomExecutionOrder: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
  SliccTraySession:
    path: ../swift-traysession

name: SliccFollower
options:
  bundleIdPrefix: com.sliccy
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
    SUPPORTS_MACCATALYST: NO
targets:
  SliccTrayKit:
    type: framework
    supportedDestinations: [iOS]
    sources:
      - path: SliccTrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.traykit
        PRODUCT_NAME: SliccTrayKit
        SKIP_INSTALL: YES
    dependencies:
      - package: WebRTC
      # Shared tray-follower transport, re-exported via TrayFollowerExports.swift.
      - package: SliccTrayFollower
      # Shared leader VFS / File Provider logic, re-exported via TrayVFSExports.swift.
      - package: SliccTrayVFS
      - sdk: FileProvider.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
  SliccFollower:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower
        # Test sources (XCTest) must not compile into the app target — they
        # belong to the SliccFollowerTests bundle below, and the app target
        # globs all of SliccFollower/.
        excludes:
          - Tests
    # The inbound deep-link route (#1918): `slicc://open?url=…`. Merged with
    # the GENERATE_INFOPLIST_FILE keys at build time.
    info:
      path: SliccFollower/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.sliccy.follower.deeplink
            CFBundleURLSchemes: [slicc]
          - CFBundleURLName: com.sliccy.follower.open-callback
            CFBundleURLSchemes: [slicc-open-callback]
        # Remote pushes (turn_end + time-sensitive sudo_request, #2062) reach
        # a suspended app only with this mode declared.
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower
        # What the user sees: home screen, Settings, permission prompts, the
        # app switcher. Deliberately not `PRODUCT_NAME`, which names the
        # binary, the scheme and the `.app` — the coverage gate, the simulator
        # test scripts, the CI job names and the TestFlight script all address
        # the target as SliccFollower.
        INFOPLIST_KEY_CFBundleDisplayName: Sliccy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        TARGETED_DEVICE_FAMILY: '1,2'
        PRODUCT_NAME: SliccFollower
        SUPPORTED_PLATFORMS: 'iphoneos iphonesimulator'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 'Take a photo to attach it to your message.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Hold the message field to dictate a message with your voice.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Dictated audio is transcribed on this device when possible to fill the message field.'
        INFOPLIST_KEY_NSFaceIDUsageDescription: 'Face ID confirms it is you before an agent action you approve is allowed to run.'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iCloud KVS for tray-session discovery. The App Store provisioning
        # profile must carry the iCloud capability; dev/simulator builds
        # without it still run — the store degrades to a local cache.
        CODE_SIGN_ENTITLEMENTS: SliccFollower/SliccFollower.entitlements
    dependencies:
      - package: GhosttyTerminal
      - target: SliccTrayKit
      - target: SliccFileProvider
      - target: SliccShareExtension
      - package: HuggingFace
      - package: WebRTC
      - package: SliccTraySession
      - package: SliccTrayFollower
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
  SliccFileProvider:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SliccFileProvider
    info:
      path: SliccFileProvider/Info.plist
      properties:
        CFBundleDisplayName: Sliccy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: group.ai.sliccy.follower
          # Required for Files.app Locations visibility. Apple's File Provider
          # extension template sets this; without it iOS can register the
          # domain (getDomains succeeds) while leaving userEnabled=false and
          # omitting the provider from Browse → Edit.
          #
          # This comment lives here, not in the generated Info.plist: xcodegen
          # rewrites that file from these properties and strips anything it
          # did not write.
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.fileprovider
        PRODUCT_NAME: SliccFileProvider
        INFOPLIST_KEY_CFBundleDisplayName: Sliccy
        CODE_SIGN_ENTITLEMENTS: SliccFileProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: SliccTrayKit
      - sdk: FileProvider.framework
      - sdk: UniformTypeIdentifiers.framework
  SliccShareExtension:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SliccShareExtension
      # Shared with the app so the two ends of the App Group inbox cannot
      # drift (#1918). Foundation-only by design.
      - path: SliccFollower/App/AppGroupInbox.swift
    info:
      path: SliccShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sliccy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Web URLs only — other payload kinds are rejected at
            # activation rather than failing inside (#1918).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.share
        PRODUCT_NAME: SliccShareExtension
        INFOPLIST_KEY_CFBundleDisplayName: Sliccy
        CODE_SIGN_ENTITLEMENTS: SliccShareExtension.entitlements
        # The share row still reaches UIApplication.open through the
        # responder chain (the ChatGPT/Claude/Grok/Bluesky pattern) —
        # only `shared` and the legacy `openURL:` carry the
        # extension-unavailable annotation, so the instance call
        # compiles under the mandatory YES here.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: UniformTypeIdentifiers.framework
  SliccFollowerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerTests
    dependencies:
      - target: SliccFollower
      - target: SliccTrayKit
      # Tests reference the moved transport types (and `@testable` a couple of
      # their internals) directly, so the test bundle must link the framework —
      # it is no longer folded into SliccTrayKit.
      - package: SliccTrayFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.tests
  SliccFollowerUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: SliccFollower/Tests/SliccFollowerUITests
    dependencies:
      - target: SliccFollower
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sliccy.follower.uitests
        TEST_TARGET_NAME: SliccFollower
schemes:
  SliccFollower:
    build:
      targets:
        SliccTrayKit: all
        SliccFileProvider: all
        SliccFollower: all
        SliccShareExtension: all
        SliccFollowerTests: [test]
        SliccFollowerUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - SliccFollower
      targets:
        # Also serial, for the UI bundle's sake rather than its own. The 47
        # unit tests total ~7s, so parallelizing them saves seconds, while the
        # simulator clones it spawns compete with the UI runner's startup and
        # leave it dying on "Timed out while loading Accessibility". Random
        # order still holds, so test independence stays enforced.
        - name: SliccFollowerTests
          parallelizable: false
          randomExecutionOrder: true
        # Serial on purpose. Each UI test is independent — it launches its own
        # app process with its own launch arguments — but cloning simulators
        # for a UI bundle races the runner install, and the clone that loses
        # fails preflight with "Busy" before any test runs. Random order still
        # holds, so the independence these tests are written for stays enforced.
        - name: SliccFollowerUITests
          parallelizable: false
          randomExecutionOrder: true
packages:
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.4.0
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    minorVersion: 0.9.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 151.0.0
  SliccTraySession:
    path: ../swift-traysession
  SliccTrayFollower:
    path: ../swift-trayfollower
  SliccTrayVFS:
    path: ../swift-traykit

version: '2'

run:
  timeout: 5m

linters:
  enable:
    - funlen
    - gocyclo
    - gocognit
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    funlen:
      lines: 120
      statements: 70
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 30
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit

formatters:
  enable:
    - gofmt
